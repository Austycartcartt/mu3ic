# Production stack: Postgres + Go API + Caddy (TLS + static web + proxy).
# Audio/artwork bytes live in Cloudflare R2, not on this host.
#
#   cp .env.example .env   # then fill it in, chmod 600
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# See DEPLOYMENT.md for the full runbook.
name: mu3ic

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mu3ic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-mu3ic}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mu3ic} -d ${POSTGRES_DB:-mu3ic}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    # No published ports: only reachable on the compose network.

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-mu3ic}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mu3ic}?sslmode=disable"
      MIGRATIONS_DIR: /migrations
      DATA_DIR: /data
      STORAGE_BACKEND: r2
      TRUST_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
    # Upload staging only (bytes go straight to R2). Wiped on restart,
    # which is fine — it never holds anything but in-flight uploads.
    tmpfs:
      - /data:mode=1777,size=1073741824
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    # No published ports: Caddy reaches it as server:8080.

  caddy:
    build:
      context: ..
      dockerfile: deploy/Caddy.Dockerfile
      args:
        EXPO_PUBLIC_API_URL: "https://${SITE_ADDRESS:?SITE_ADDRESS is required}"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
